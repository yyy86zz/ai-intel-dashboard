        <span class="mark"></span><i>02</i><span class="only-wide">内容瀑布流</span><span class="only-narrow">瀑布流</span>
      </button>
      <button class="tab" data-tab="library" style="--accent:#b98a4e" role="tab">
        <span class="mark"></span><i>03</i><span class="only-wide">总表 · 知识库</span><span class="only-narrow">知识库</span>
      </button>
      <button class="tab" data-tab="decision" style="--accent:#7a6fa8" role="tab">
        <span class="mark"></span><i>04</i><span>决策</span>
      </button>
      <span class="folder-label" id="folderLabel">DOSSIER · 2026</span>
    </div>

    <main class="sheet">
      <div class="running-head">
        <span>每日情报卷宗 · <b>Daily Dossier</b></span>
        <span class="rh-hide" id="rhRight">—</span>
      </div>
      <section class="view" id="view-overview"></section>
      <section class="view" id="view-waterfall" hidden></section>
      <section class="view" id="view-library" hidden></section>
      <section class="view" id="view-decision" hidden></section>
    </main>
  </div>

  <footer class="foot">
    <span>内部资料 · 仅供决策参考</span>
    <span>每条结论均可回链原文核对</span>
    <span id="footMeta">—</span>
  </footer>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<button class="immersive-filter" id="immersiveFilter" type="button">筛选</button>
<button class="immersive-toggle" id="immersiveToggle" type="button">沉浸阅读</button>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   状态与工具
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LV_RANK = { S: 0, A: 1, B: 2, C: 3 };
const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const MONTHS = { jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12' };

let allData = [];
let statsData = {};
let sourcesCfg = { sources: [] };
let cloudMode = false;
let cloudVersion = 0;
let M = null;
let tab = 'overview';
let immersive = false;
let wfShown = 0;
let ovDate = (location.hash || '').replace('#', '') || null;
const BRIEFS = (window.__BRIEFS__ && Object.keys(window.__BRIEFS__).length)
  ? window.__BRIEFS__
  : (window.__BRIEF__ ? { [window.__BRIEF__.date]: window.__BRIEF__ } : {});

const wf  = { topic: '全部', event: '全部', q: '', sort: '最新' };
const lib = { view: 'table', q: '' };
const dec = { filter: '重点', show: 12 };

const edits = (() => { try { return JSON.parse(localStorage.getItem('xlsx_edits') || '{}'); } catch (e) { return {}; } })();
const decState = (() => { try { return JSON.parse(localStorage.getItem('dec_state') || '{}'); } catch (e) { return {}; } })();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1900);
}
function fmtDate(v) {
  const s = String(v || '');
  const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}.${m[2]}.${m[3]}` : s;
}
function isoDate(v) {
  const s = String(v || '').trim();
  const m = s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);
  if (m) return `${m[3]}-${MONTHS[m[2].toLowerCase()] || '01'}-${m[1].padStart(2, '0')}`;
  return s;
}
function weekdayOf(v) {
  const m = String(v || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  return WEEKDAYS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()];
}
function weekOf(v) {
  const m = String(v || '').match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7);
}
function hostOf(u) {
  try {
    const x = new URL(u);
    const p = x.pathname.length > 32 ? x.pathname.slice(0, 32) + '…' : x.pathname;
    return x.hostname.replace(/^www\./, '') + p;
  } catch (e) { return String(u || ''); }
}
function plainText(v) {
  return String(v == null ? '' : v).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}
function parseSource(raw) {
  const s = String(raw || '');
  const [head, vertical = ''] = s.split('｜');
  const cm = head.match(/（多源交叉×(\d+)）/);
  const cross = cm ? +cm[1] : 0;
  const parts = head.replace(/（多源交叉×\d+）/g, '').split(' + ').map(x => x.trim()).filter(Boolean);
  return { primary: parts[0] || '未知信源', extra: Math.max(0, parts.length - 1), parts, cross, vertical };
}
function credOf(d) {
  const c = d['可信度'] || '待核验';
  const cls = c === '真实' ? 'ok' : c === '存疑' ? 'bad' : 'warn';
  return { c, cls, score: d['信源权重'] == null ? '—' : d['信源权重'] };
}
const TOPIC_COLORS = {
  '基础模型与算法': '#3f63b0',
  'Agent与工作流': '#6a5bb0',
  '多模态与生成': '#b4556c',
  '算力与芯片': '#a9762a',
  '具身智能与机器人': '#2f8f6f',
  '开发者基础设施': '#2b5f8a',
  '终端与消费产品': '#3d7fa8',
  '行业应用与企业服务': '#8a6a3f',
  '安全合规与治理': '#a63a46',
  '其他': '#8a97a4',
};
const EVENT_COLORS = {
  '政策监管': '#a63a46', '融资并购': '#a63a46',
  '模型与技术发布': '#2b5f8a', '产品上线': '#3d7fa8', '市场与竞争': '#8a6a3f',
  '开源与生态': '#2f8f6f', '论文与评测': '#6a5bb0', '组织与人事': '#8a97a4',
  '其他': '#b7c0c8',
};
function hasCJK(t) { return /[\u4e00-\u9fff]/.test(t || ''); }
function zhTitle(d) { return String(d['中文标题'] || '').trim() || d['标题'] || '(无标题)'; }
function origTitle(d) {
  const zh = String(d['中文标题'] || '').trim();
  return (zh && !hasCJK(d['标题'])) ? d['标题'] : '';
}
function topicOf(d) { return d['主题域'] || d['领域'] || '未分类'; }
function eventOf(d) { return d['事件类型'] || '其他'; }
function domColor(topic) { return TOPIC_COLORS[topic] || '#8a97a4'; }
function evColor(ev) { return EVENT_COLORS[ev] || '#b7c0c8'; }
function splitSummary(text) {
  const i = String(text || '').indexOf('（原文：');
  if (i < 0) return { zh: String(text || ''), en: '' };
  return {
    zh: String(text).slice(0, i).trim(),
    en: String(text).slice(i).replace(/^（原文：/, '').replace(/）\s*$/, '').trim(),
  };
}
function summaryOf(d) {
  const read = (t) => {
    if (/^Computer Science >/.test(t)) {
      const m = t.match(/^Computer Science >\s*(.+?)\s+arXiv:([\w.\-]+)/);
      const cat = m ? m[1].trim() : '';
      const id = m ? m[2] : ((t.match(/arXiv:([\w.\-]+)/) || [])[1] || '');
      const sub = (t.match(/\[Submitted on ([^\]]+)\]/) || [])[1] || '';
      return { kind: 'meta', cat, id, sub: isoDate(sub), text: '' };
    }
    return { kind: 'text', text: plainText(t) };
  };
  const t = String(d['要点摘要'] || '').trim();
  if (t) return read(t);
  const ex = String(d['原文摘录'] || '').trim();
  if (!ex) return { kind: 'empty', text: '' };
  const parsed = read(ex);
  return parsed.kind === 'meta' ? parsed : { kind: 'excerpt', text: parsed.text };
}
function computeMeta(list = allData) {
  const byLevel = { S: 0, A: 0, B: 0, C: 0 };
  const byCred = { '真实': 0, '待核验': 0, '存疑': 0 };
  const byTopic = {};
  const byEvent = {};
  list.forEach(d => {
    if (byLevel[d['影响等级']] !== undefined) byLevel[d['影响等级']]++;
    if (byCred[d['可信度']] !== undefined) byCred[d['可信度']]++;
    const tp = topicOf(d);
    byTopic[tp] = (byTopic[tp] || 0) + 1;
    const ev = eventOf(d);
    byEvent[ev] = (byEvent[ev] || 0) + 1;
  });
  const cross = list.filter(d => /多源交叉/.test(d['信源'] || '')).length;
  const dates = list.map(d => String(d['发布时间'] || '')).filter(Boolean).sort();
  return { byLevel, byCred, byTopic, byEvent, cross, total: list.length, lastDate: dates[dates.length - 1] || '' };
}
function sortTopics(obj) {
  return Object.entries(obj).sort((a, b) => ((a[0] === '其他') - (b[0] === '其他')) || (b[1] - a[1]));
}
function sortEvents(obj) {
  return Object.entries(obj).sort((a, b) => ((a[0] === '其他') - (b[0] === '其他')) || (b[1] - a[1]));
}
function lvlStamp(lv, extra = '') {
  return `<span class="lvl-stamp lv-${esc(lv || 'C')}" ${extra}>${esc(lv || 'C')}</span>`;
}

/* ==========================================================
   加载
   ========================================================== */
async function load() {
  if (window.__DATA__ && Array.isArray(window.__DATA__)) {
    allData = window.__DATA__;
    statsData = window.__STATS__ || {};
    sourcesCfg = window.__SOURCES__ || { sources: [] };
  } else {
    cloudMode = true;
    try {
      const j = await (await fetch('/api/data')).json();
      allData = j.data || [];
      statsData = j.stats || {};
      sourcesCfg = j.sources || { sources: [] };
      cloudVersion = j.version || 0;
      startPolling();
    } catch (e) {
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="loaderr">数据加载失败：请确认看板服务已启动，或改用本地 HTML 文件。</div>');
    }
  }
  init();
}

function startPolling() {
  setInterval(async () => {
    try {
      if (document.activeElement && document.activeElement.isContentEditable) return;
      if (document.body.classList.contains('drawer-open')) return;
      const j = await (await fetch('/api/version')).json();
      if (j.version === cloudVersion) return;
      const nd = await (await fetch('/api/data')).json();
      allData = nd.data || [];
      statsData = nd.stats || {};
      sourcesCfg = nd.sources || { sources: [] };
      cloudVersion = nd.version || 0;
      M = computeMeta();
      renderMetaHead();
      refresh();
    } catch (e) { /* 忽略网络抖动 */ }
  }, 5000);
}

function init() {
  if (!cloudMode) applyEdits();
  M = computeMeta();
  renderMetaHead();
  $$('#tabs .tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  window.addEventListener('resize', debounce(() => { if (tab === 'waterfall') layoutWaterfall(); }, 140));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('drawer-open')) closeDrawer();
    else if (immersive) setImmersive(false);
  });
  $('#mask').addEventListener('click', closeDrawer);
  const immersiveBtn = $('#immersiveToggle');
  if (immersiveBtn) immersiveBtn.addEventListener('click', () => setImmersive(!immersive));
  const filterBtn = $('#immersiveFilter');
  if (filterBtn) filterBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('filter-open');
    filterBtn.textContent = open ? '收起筛选' : '筛选 · ' + (wfShown || M.total);
    requestAnimationFrame(() => layoutWaterfall());
    setTimeout(() => layoutWaterfall(), 220);
  });
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#', '');
    if (h && h !== ovDate) {
      ovDate = h;
      if (tab === 'overview') renderOverview();
    }
  });
  refresh();
}

function renderMetaHead() {
  const d = M.lastDate || '';
  const short = d.replace(/-/g, '');
  $('#dossierNo').textContent = short ? 'INT—' + short : 'INT—';
  $('#dossierDate').textContent = d ? fmtDate(d) + ' ' + weekdayOf(d) : '—';
  $('#folderLabel').textContent = 'DOSSIER · ' + (d ? d.slice(0, 7).replace('-', '.') : '2026');
  $('#rhRight').textContent = `总库 ${M.total} 条 · 重点 ${M.byLevel.S + M.byLevel.A} · 最新 ${d ? fmtDate(d) : '—'}`;
  $('#footMeta').textContent = 'ARCHIVE ' + (d ? d.slice(0, 4) : '2026') + ' · ' + M.total + ' ENTRIES';
}

function switchTab(next) {
  tab = next;
  if (next !== 'waterfall' && immersive) setImmersive(false);
  const it = $('#immersiveToggle');
  if (it) it.style.display = next === 'waterfall' ? 'flex' : 'none';
  $$('#tabs .tab').forEach(t => {
    const on = t.dataset.tab === next;
    t.classList.toggle('is-active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  ['overview', 'waterfall', 'library', 'decision'].forEach(v => {
    $('#view-' + v).hidden = (v !== next);
  });
  window.scrollTo(0, 0);
  refresh();
}
function setImmersive(on) {
  immersive = !!on;
  document.body.classList.toggle('is-immersive', immersive);
  if (!immersive) document.body.classList.remove('filter-open');
  const btn = $('#immersiveToggle');
  if (btn) btn.textContent = immersive ? '退出沉浸' : '沉浸阅读';
  const fb = $('#immersiveFilter');
  if (fb) fb.textContent = '筛选 · ' + (wfShown || M.total);
  requestAnimationFrame(() => { if (tab === 'waterfall') layoutWaterfall(); });
  setTimeout(() => { if (tab === 'waterfall') layoutWaterfall(); }, 220);
}

function refresh() {
  if (tab === 'overview') renderOverview();
  else if (tab === 'waterfall') renderWaterfall();
  else if (tab === 'library') renderLibrary();
  else if (tab === 'decision') renderDecision();
}

/* ==========================================================
   01 概览
   ========================================================== */
function renderOverview() {
  const dates = Array.from(new Set(allData.map(d => String(d['发布时间'] || '')).filter(Boolean))).sort().reverse();
  const date = (ovDate && dates.includes(ovDate)) ? ovDate : (dates[0] || '');
  const day = date ? allData.filter(d => String(d['发布时间'] || '') === date) : allData.slice();
  const m = computeMeta(day);
  const brief = (BRIEFS[date] && BRIEFS[date].text) ? BRIEFS[date].text : '';
  const dayIndex = dates.indexOf(date);
  const key = m.byLevel.S + m.byLevel.A;
  const real = m.byCred['真实'];
  const pending = m.byCred['待核验'];
  const doubt = m.byCred['存疑'];
  const realRate = m.total ? Math.round(real / m.total * 100) : 0;
  const topics = sortTopics(m.byTopic);
  const events = sortEvents(m.byEvent);
  const top3 = topics.filter(x => x[0] !== '其他').slice(0, 3).map(x => x[0]);
  const topicCount = topics.filter(x => x[0] !== '其他').length;
  const dstr = date ? fmtDate(date) : '—';
  const wd = weekdayOf(date);
  const maxDom = topics.length ? Math.max(...topics.map(x => x[1])) : 1;
  const maxEv = events.length ? Math.max(...events.map(x => x[1])) : 1;

  const other = m.byTopic['其他'] || 0;
  const otherPct = m.total ? Math.round(other / m.total * 100) : 0;
  const noise = otherPct >= 12 ? `另有 ${other} 条未识别为 AI 前沿内容（占 ${otherPct}%），建议在信源层收敛或启用 LLM 复核。` : '';
  const lede = m.total
    ? `本期共归档 ${m.total} 条前沿情报，其中 ${key} 条进入重点视野，${real} 条判定为真实、${pending} 条仍待核验。情报集中在${top3.join('、')}三个方向；${m.cross} 条获得跨出版方交叉佐证，其余为单一来源，建议结合原文复核后再行采信。${noise}`
    : '尚未采集到情报数据，请先运行采集脚本或同步云端数据。';

  const rail = [
    ['本期收录', m.total, '条', '覆盖 ' + topicCount + ' 个主题域'],
    ['重点事件', key, '条', 'S / A 级'],
    ['判定真实', real, '条', '可信度 ≥ 85'],
    ['多源交叉', m.cross, '条', '独立出版方 ≥ 2'],
    ['待核验', pending, '条', '需人工复核'],
    ['在采信源', Object.keys(statsData).length, '个', '纵向评级在册'],
  ];

  const entries = day
    .filter(d => ['S', 'A'].includes(d['影响等级']))
    .sort((a, b) => (LV_RANK[a['影响等级']] - LV_RANK[b['影响等级']]) || (b['信源权重'] - a['信源权重']));

  $('#view-overview').innerHTML = `
    <div class="cover">
      <aside class="cover-rail">
        ${rail.map(([k, v, unit, note]) => `
          <div class="rail-item">
            <div class="rail-k">${k}</div>
            <div class="rail-v num">${v}<small>${unit}</small></div>
            <div class="rail-note">${note}</div>
          </div>`).join('')}
        <div class="verify-stamp">一致性校验通过<small>${m.total} / ${m.total} VERIFIED</small></div>
      </aside>

      <div class="cover-main">
        <div class="view-head">
          <h2>本期概览</h2>
          <span class="vh-rule"></span>
          <div class="date-nav">
            <button class="dn-btn" id="ovPrev" ${dayIndex >= dates.length - 1 ? 'disabled' : ''} title="前一天">‹</button>
            <select class="dn-select" id="ovDate" aria-label="选择日期">
              ${dates.map(dt => `<option value="${dt}" ${dt === date ? 'selected' : ''}>${fmtDate(dt)} ${weekdayOf(dt)} · ${allData.filter(x => String(x['发布时间'] || '') === dt).length} 条</option>`).join('')}
            </select>
            <button class="dn-btn" id="ovNext" ${dayIndex <= 0 ? 'disabled' : ''} title="后一天">›</button>
          </div>
        </div>
        <div class="memo-label">本期综述 · Editorial</div>
        ${brief
          ? `<div class="brief-text">${brief.split(/\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}</div>
             <div class="brief-stats">数据：${m.total} 条 · 重点 ${key} · 真实 ${real} · 其他 ${other}（未识别） · 覆盖 ${topicCount} 个主题域</div>`
          : `<p class="lede">${esc(lede)}</p>`}
        <div class="memo-sign">—— ${brief ? 'DeepSeek 生成' : '规则生成'} · ${dstr}</div>

        <div class="essentials">
          <div class="sec-h">
            <h3>本期要点</h3>
            <span class="tag">S / A 级 · 按影响度排序</span>
            <span class="line"></span>
          </div>
          ${entries.length ? entries.map((d, i) => entryHTML(d, i)).join('') : '<div class="empty">本期无 S/A 级事件</div>'}
        </div>
      </div>
    </div>

    <section class="appendix">
      <div class="sec-h">
        <h3>附录 · 本期统计</h3>
        <span class="tag">APPENDIX</span>
        <span class="line"></span>
      </div>
      <div class="appendix-grid">
        <div>
          <div class="memo-label">主题域 · Topic</div>
          ${topics.map(([name, n]) => `
            <div class="dom">
              <div class="dom-top">
                <span>${esc(name)}</span><span class="n">${n}</span>
              </div>
              <div class="dom-track"><i class="dom-fill" style="display:block;width:${Math.max(2, n / maxDom * 100)}%;background:${domColor(name)}"></i></div>
            </div>`).join('') || '<div class="empty">暂无数据</div>'}
          <p class="cred-note">「其他」= 未命中 AI 相关性信号，多为综合商业／消费资讯，不计入方向判断。</p>
        </div>
        <div>
          <div class="memo-label">事件类型 · Event</div>
          ${events.map(([name, n]) => `
            <div class="dom">
              <div class="dom-top">
                <span>${esc(name)}</span><span class="n">${n}</span>
              </div>
              <div class="dom-track"><i class="dom-fill" style="display:block;width:${Math.max(2, n / maxEv * 100)}%;background:${evColor(name)}"></i></div>
            </div>`).join('') || '<div class="empty">暂无数据</div>'}
        </div>
        <div>
          <div class="memo-label">可信度构成 · Credibility</div>
          <div class="cred-big"><b>${realRate}%</b><span>判定为真实</span></div>
          <div class="cred-track">
            ${credSeg(real, m.total, '#357a5f')}
            ${credSeg(pending, m.total, '#b0803a')}
            ${credSeg(doubt, m.total, '#a63a46')}
          </div>
          <div class="cred-legend">
            ${credRow('#357a5f', '真实', real, m.total)}
            ${credRow('#b0803a', '待核验', pending, m.total)}
            ${credRow('#a63a46', '存疑', doubt, m.total)}
          </div>
          <div class="level-stamps">
            ${['S', 'A', 'B', 'C'].map(lv => `<span class="ls">${lvlStamp(lv)}<b>${m.byLevel[lv]}</b></span>`).join('')}
          </div>
          <p class="cred-note">口径：信源权重 ×0.7 + 纵向历史 ×0.3；每增加一个独立出版方 +3，匿名信源 −10。</p>
        </div>
      </div>
    </section>`;

  $$('#view-overview .entry').forEach(el => {
    el.addEventListener('click', () => openDrawer(+el.dataset.i));
  });

  const setDay = (dt) => {
    ovDate = dt;
    try { history.replaceState(null, '', '#' + dt); } catch (e) { location.hash = dt; }
    renderOverview();
  };
  const sel = $('#ovDate');
  if (sel) sel.addEventListener('change', e => setDay(e.target.value));
  const prev = $('#ovPrev');
  if (prev) prev.addEventListener('click', () => { if (dayIndex < dates.length - 1) setDay(dates[dayIndex + 1]); });
  const next = $('#ovNext');
  if (next) next.addEventListener('click', () => { if (dayIndex > 0) setDay(dates[dayIndex - 1]); });
}

function credSeg(n, total, color) {
  if (!n || !total) return '';
  return `<i style="width:${Math.max(2, n / total * 100)}%;background:${color}"></i>`;
}
function credRow(color, label, n, total) {
  const pct = total ? Math.round(n / total * 100) : 0;
  return `<div class="cred-row"><i class="cred-dot" style="background:${color}"></i><span>${label}</span>
    <i class="fill"></i><b>${n}</b><i>${pct}%</i></div>`;
}

function entryHTML(d, i) {

}

function renderWaterfallGrid() {
  const grid = $('#wfGrid');
  if (!grid) return;
  const q = wf.q.trim().toLowerCase();
  let list = allData.map((d, i) => ({ d, i }));
  if (wf.topic !== '全部') list = list.filter(x => topicOf(x.d) === wf.topic);
  if (wf.event !== '全部') list = list.filter(x => eventOf(x.d) === wf.event);
  if (q) {
    list = list.filter(x => [x.d['标题'], x.d['要点摘要'], x.d['信源'], topicOf(x.d), eventOf(x.d), x.d['研判结论']]
      .join(' ').toLowerCase().includes(q));
  }
  const otherLast = (d) => (topicOf(d) === '其他' ? 1 : 0) + (eventOf(d) === '其他' ? 1 : 0);
  const sorters = {
    '最新': (a, b) => String(b.d['发布时间'] || '').localeCompare(String(a.d['发布时间'] || ''))
      || (otherLast(a.d) - otherLast(b.d)),
    '影响等级': (a, b) => (LV_RANK[a.d['影响等级']] ?? 9) - (LV_RANK[b.d['影响等级']] ?? 9),
    '可信度': (a, b) => (b.d['信源权重'] ?? 0) - (a.d['信源权重'] ?? 0),
  };
  list.sort(sorters[wf.sort] || sorters['最新']);

  grid.innerHTML = list.length
    ? list.map(({ d, i }) => noteHTML(d, i)).join('')
    : '<div class="empty">没有匹配的情报</div>';
  const filters = [];
  if (wf.topic !== '全部') filters.push('主题「' + wf.topic + '」');
  if (wf.event !== '全部') filters.push('事件「' + wf.event + '」');
  if (q) filters.push('关键词「' + wf.q + '」');
  wfShown = list.length;
  const fb = $('#immersiveFilter');
  if (fb && !document.body.classList.contains('filter-open')) fb.textContent = '筛选 · ' + wfShown;
  $('#wfCount').textContent = `共 ${list.length} 条${filters.length ? ' · ' + filters.join(' · ') : ''}`;

  layoutWaterfall();
  grid.querySelectorAll('.note').forEach(el => el.addEventListener('click', () => openDrawer(+el.dataset.i)));
}

function noteHTML(d, i) {
  const s = parseSource(d['信源']);
  const c = credOf(d);
  const sum = summaryOf(d);
  const topic = topicOf(d);
  const event = eventOf(d);
  let body = '';
  if (sum.kind === 'text') {
    const parts = splitSummary(sum.text);
    body = `<div class="note-body"><p class="note-zh">${esc(parts.zh)}</p>${parts.en ? `<p class="note-orig"><span>原文</span>${esc(parts.en)}</p>` : ''}</div>`;
  }
  else if (sum.kind === 'excerpt') body = `<div class="note-body"><span class="excerpt-tag">原文摘录</span>${esc(sum.text)}</div>`;
  else if (sum.kind === 'meta') body = `<div class="note-body"><div class="note-arxiv"><code>arXiv:${esc(sum.id)}</code> · ${esc(sum.cat)}${sum.sub ? ' · ' + esc(fmtDate(sum.sub)) : ''}</div>论文元数据已入库，摘要待生成。</div>`;
  else body = `<div class="note-body" style="color:#9aa8b5">摘要待生成</div>`;
  return `<article class="note" data-i="${i}" style="--dom-color:${domColor(topic)}">
    <div class="note-top">
      <div class="note-head">
        <h3 class="note-title">${esc(zhTitle(d))}</h3>
        ${origTitle(d) ? `<div class="note-title-orig">（${esc(origTitle(d))}）</div>` : ''}
      </div>
      ${lvlStamp(d['影响等级'] || 'C')}
    </div>
    <div class="note-meta-line">
      <span class="note-no" title="档案序号：当前数据集内的排列位置，非事件 ID">№ ${String(i + 1).padStart(3, '0')}</span>
      <span class="note-dom">${esc(topic)}</span>
      <span class="note-ev">${esc(event)}</span>
    </div>
    ${body}
    <div class="note-foot">
      <span class="src">
        <i class="src-mark">${esc((s.primary || '?').slice(0, 1))}</i>
        <span class="src-name">${esc(s.primary)}${s.extra ? ' +' + s.extra : ''}</span>
      </span>
      <span class="note-foot-right">
        <span class="note-lvl-foot">${lvlStamp(d['影响等级'] || 'C')}</span>
        <span class="cred cred-${c.cls}" title="可信度 ${esc(c.score)} · ${esc(c.c)}"><b>${esc(c.score)}</b><em>可信</em></span>
      </span>
    </div>
  </article>`;
}

function layoutWaterfall() {
  const grid = $('#wfGrid');
  if (!grid) return;
  const cards = Array.from(grid.children).filter(el => el.classList.contains('note'));
  if (!cards.length) { grid.style.height = '0px'; return; }

  const mobile = window.innerWidth <= 720;
  const gap = mobile ? (immersive ? 8 : 10) : 15;
  const min = mobile ? 140 : 290;
  const maxCols = mobile ? 2 : 4;
  const W = grid.clientWidth;
  const cols = Math.max(1, Math.min(maxCols, Math.floor((W + gap) / (min + gap))));
  const colW = (W - gap * (cols - 1)) / cols;

  cards.forEach(el => { el.style.width = colW + 'px'; });
  const heights = new Array(cols).fill(0);
  cards.forEach(el => {
    const h = el.offsetHeight;
    let c = 0;
    for (let i = 1; i < cols; i++) if (heights[i] < heights[c] - 0.5) c = i;
    el.style.transform = `translate3d(${c * (colW + gap)}px, ${heights[c]}px, 0)`;
    heights[c] += h + gap;
  });
  grid.style.height = Math.max(...heights) - gap + 2 + 'px';
}

const COLS = ['中文标题', '标题', '主题域', '事件类型', '信源', '信源权重', '可信度', '发布时间', '链接', '要点摘要', '研判结论', '决策建议', '影响等级', '事件ID'];

function tableHTML(list) {
  const rows = list.map(({ d, i }) => `<tr>${COLS.map(col => {
    const raw = d[col] == null ? '' : d[col];
    const v = (col === '要点摘要' || col === '研判结论' || col === '决策建议') ? plainText(raw) : raw;

    const cls = col === '标题' ? 'cell-title' : col === '主题域' ? 'cell-topic'
      : col === '事件类型' ? 'cell-event' : col === '要点摘要' ? 'cell-summary' : '';

      <span class="scroll-hint">← 横向滚动查看全部 14 列</span>

function editKey(d, col) {
  return (window.__FILE__ || 'local') + '::' + (d['事件ID'] || d['链接'] || d['标题']) + '::' + col;
}
function applyEdits() {
  allData.forEach(d => COLS.forEach(c => {
    const k = editKey(d, c);
    if (k in edits) d[c] = edits[k];
  }));
}
function saveEdit(d, col, val) {
  const k = editKey(d, col);
  if (String(d[col] == null ? '' : d[col]) === val) delete edits[k];
  else edits[k] = val;
  d[col] = val;
  try { localStorage.setItem('xlsx_edits', JSON.stringify(edits)); } catch (e) {}
}
function onCellEdit(cell) {
  const d = allData[+cell.dataset.i];
  const col = cell.dataset.col;
  if (!d || !col) return;
  const val = cell.textContent.trim();
  if (cell.dataset.orig != null && cell.dataset.orig === val) return;
  if (String(d[col] == null ? '' : d[col]) === val) return;
  if (cloudMode) {
    const key = d['事件ID'] || d['链接'] || d['标题'];
    fetch('/api/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_id: key, fields: { [col]: val } })
    }).then(r => r.json()).then(j => {
      if (j.version) cloudVersion = j.version;
      d[col] = val;
      cell.classList.add('edited');
      M = computeMeta(); renderMetaHead();
    }).catch(() => { cell.classList.remove('edited'); });
    return;
  }
  saveEdit(d, col, val);
  cell.classList.toggle('edited', editKey(d, col) in edits);
  M = computeMeta(); renderMetaHead();
}
function exportCSV() {
  const csv = [COLS.join(',')].concat(allData.map(d => COLS.map(c => {
    const v = String(d[c] == null ? '' : d[c]).replace(/"/g, '""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = 'AI前沿战略情报库_编辑后.csv';
  a.click();
  toast('已导出 CSV');
}
function resetEdits() {
  if (!confirm('确定清除所有在线编辑，恢复原始数据？')) return;
  Object.keys(edits).forEach(k => delete edits[k]);
  try { localStorage.removeItem('xlsx_edits'); } catch (e) {}
  if (window.__DATA__) allData = JSON.parse(JSON.stringify(window.__DATA__));
  M = computeMeta(); renderMetaHead(); renderLibBody();
  toast('已恢复原始数据');
}

function kbHTML(list) {
  if (!list.length) return '<div class="empty">没有匹配的记录</div>';

  list.forEach(({ d, i }) => {

          return `<article class="kb-card" data-i="${i}" style="--dom-color:${domColor(dm)}">
            <h4>${esc(zhTitle(d))}</h4>
            ${origTitle(d) ? `<div class="kb-orig">（${esc(origTitle(d))}）</div>` : ''}

            <div class="kb-meta">
              ${lvlStamp(d['影响等级'] || 'C')}
              <span>${esc(eventOf(d))}</span>
              <span>/</span>
              <span>${esc(s.primary)}${s.extra ? ' +' + s.extra : ''}</span>
              <span>/</span><span>可信 ${esc(c.score)}</span>
              <span>/</span><span>${esc(fmtDate(d['发布时间']))}</span>
            </div>
          </article>`;
        }).join('')}
      </div>
    </div>`).join('');
}

/* ==========================================================
   04 决策
   ========================================================== */
function decStatusOf(d) { return decState[d['事件ID']] || '待研判'; }

function renderDecision() {
  const m = M;
  const key = m.byLevel.S + m.byLevel.A;
  const real = m.byCred['真实'];
  const counts = { '待研判': 0, '跟进': 0, '观察': 0, '忽略': 0 };
  allData.forEach(d => {
    const s = decStatusOf(d);
    if (counts[s] !== undefined) counts[s]++;
  });

  const relevant = m.total - (m.byTopic['其他'] || 0);
  const steps = [
    ['采集入库', m.total, 1],
    ['AI 相关', relevant, m.total ? relevant / m.total : 0],
    ['判定真实', real, m.total ? real / m.total : 0],
    ['多源交叉', m.cross, m.total ? m.cross / m.total : 0],
    ['进入决策', key, m.total ? key / m.total : 0],
  ];

  const filters = ['重点', '全部', '跟进', '观察', '忽略'];
  const fcount = { '重点': key, '全部': m.total, '跟进': counts['跟进'], '观察': counts['观察'], '忽略': counts['忽略'] };
  let list = allData.slice();
  if (dec.filter === '重点') list = list.filter(d => ['S', 'A'].includes(d['影响等级']));
  else if (dec.filter !== '全部') list = list.filter(d => decStatusOf(d) === dec.filter);
  list.sort((a, b) => (LV_RANK[a['影响等级']] ?? 9) - (LV_RANK[b['影响等级']] ?? 9)
    || (b['信源权重'] ?? 0) - (a['信源权重'] ?? 0));
  const shown = list.slice(0, dec.show);

  $('#view-decision').innerHTML = `
    <div class="view-head">
      <h2>决策处置</h2>
      <span class="vh-rule"></span>
      <span class="vh-meta">人工研判 · 状态存本机</span>
    </div>

    <div class="route">
      ${steps.map(([label, n, ratio]) => `
        <div class="route-step">
          <div class="route-k">${label}</div>
          <div class="route-n num">${n}<small>条</small></div>
          <div class="route-bar"><i style="width:${Math.max(3, Math.round(ratio * 100))}%"></i></div>
        </div>`).join('')}
    </div>
    <div class="route-note">分级依据：可信度 + 多源交叉 + 事件类型（政策/融资加权）+ 头部厂商权重；主题域为「其他」的不享受事件加权。「AI 相关」= 主题域不为「其他」。进入「决策」不等于已采纳，须由人工标记处置状态。</div>

    <div class="dec-layout">
      <div>
        <div class="sec-h">
          <h3>处置清单</h3>
          <span class="tag">${dec.filter === '重点' ? 'S / A 优先' : ''}</span>
          <span class="line"></span>
        </div>
        <div class="dec-filters">
          ${filters.map(f => `<button class="idx ${dec.filter === f ? 'is-active' : ''}" data-f="${f}">${f}<span>${fcount[f]}</span></button>`).join('')}
        </div>
        ${shown.length ? shown.map(d => decItemHTML(d)).join('') : '<div class="empty">该状态下暂无事件</div>'}
        ${list.length > shown.length ? `<button class="btn ghost more-btn" id="decMore">展开更多 · 剩余 ${list.length - shown.length} 条</button>` : ''}
      </div>

      <aside class="rail">
        <section class="rail-block">
          <div class="sec-h"><h3>决策台账</h3><span class="line"></span></div>
          <div class="ledger">
            <div><b>${counts['待研判']}</b><span>待研判</span></div>
            <div><b>${counts['跟进']}</b><span>跟进</span></div>
            <div><b>${counts['观察']}</b><span>观察</span></div>
            <div><b>${counts['忽略']}</b><span>忽略</span></div>
          </div>
        </section>

        <section class="rail-block">
          <div class="sec-h"><h3>信源纵向评级</h3><span class="line"></span></div>
          ${sourceRatingHTML()}
        </section>

        <section class="rail-block">
          <div class="sec-h"><h3>决策参数</h3><span class="line"></span></div>
          <div class="param-card">
            <b>企业战略参数库 · 未接入</b>
            接入预算区间、在研项目、技术栈与风险偏好后，可生成「试点 / 采购 / 立项」级动作建议。
          </div>
        </section>
      </aside>
    </div>`;

  $$('#view-decision .dec-filters .idx').forEach(b => b.addEventListener('click', () => {
    dec.filter = b.dataset.f; dec.show = 12; renderDecision();
  }));
  const more = $('#decMore');
  if (more) more.addEventListener('click', () => { dec.show += 12; renderDecision(); });

  $$('#view-decision .dec-item').forEach(el => {
    el.querySelectorAll('.dec-btn').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation();
      setDecStatus(el.dataset.id, btn.dataset.act);
    }));
    el.querySelector('.dec-title').addEventListener('click', e => {
      e.preventDefault();
      openDrawer(+el.dataset.i);
    });
  });
}

function decItemHTML(d) {
  const s = parseSource(d['信源']);
  const c = credOf(d);
  const st = decStatusOf(d);
  const sum = summaryOf(d);
  const body = d['决策建议'] || d['研判结论'] || (sum.kind === 'text' ? sum.text : '论文元数据已入库，摘要待生成。');
  const cls = st === '跟进' ? 'is-follow' : st === '观察' ? 'is-watch' : st === '忽略' ? 'is-ignore' : '';
  const idx = allData.indexOf(d);
  return `<article class="dec-item ${cls}" data-id="${esc(d['事件ID'] || '')}" data-i="${idx}">
    ${lvlStamp(d['影响等级'] || 'C')}
    <div class="dec-main">
      <a class="dec-title" href="${esc(d['链接'] || '#')}" title="${esc(d['标题'] || '')}">${esc(zhTitle(d))}</a>
      <div class="dec-sum">${esc(body)}</div>
      <div class="dec-meta">
        <span>${esc(topicOf(d))}</span><span>/</span>
        <span>${esc(eventOf(d))}</span><span>/</span>
        <span>${esc(s.primary)}${s.extra ? ' +' + s.extra : ''}</span><span>/</span>
        <span>可信 ${esc(c.score)}</span>
        ${s.cross ? `<span>/ 多源 ×${s.cross}</span>` : ''}
      </div>
    </div>
    <div class="dec-side">
      <div class="dec-btns">
        ${['跟进', '观察', '忽略'].map(a => `<button class="dec-btn ${st === a ? 'on' : ''}" data-act="${a}">${a}</button>`).join('')}
      </div>
    </div>
  </article>`;
}

function setDecStatus(id, act) {
  if (!id) return;
  if (decState[id] === act) delete decState[id];
  else decState[id] = act;
  try { localStorage.setItem('dec_state', JSON.stringify(decState)); } catch (e) {}
  toast(`已标记为「${decState[id] || '待研判'}」`);
  renderDecision();
}

function sourceRatingHTML() {
  const entries = Object.entries(statsData);
  if (!entries.length) return '<div class="empty" style="padding:24px 0">暂无信源统计</div>';
  entries.sort((a, b) => (b[1].reliability ?? 0) - (a[1].reliability ?? 0));
  return entries.map(([id, s]) => {
    const rel = s.reliability;
    const tone = rel == null ? 'watch' : rel >= 75 ? 'good' : rel >= 60 ? 'watch' : 'bad';
    const vcls = tone === 'good' ? 'v-good' : tone === 'watch' ? 'v-watch' : 'v-bad';
    return `<div class="src-item">
      <div class="src-top">
        <span class="name">${esc(s.name || id)}</span>
        <span class="verdict ${vcls}">${esc(s.verdict || '数据不足')}</span>
      </div>
      <div class="src-bar"><i class="${tone === 'good' ? '' : tone}" style="width:${rel == null ? 0 : Math.max(0, Math.min(100, rel))}%"></i></div>
      <div class="src-nums">抓 ${s.total_collected ?? 0} / 过 ${s.total_verified ?? 0} / 交叉 ${s.cross_validated ?? 0} / 可靠度 ${rel ?? '—'}</div>
    </div>`;
  }).join('');
}

/* ==========================================================
   抽屉
   ========================================================== */
function openDrawer(i) {
  const d = allData[i];
  if (!d) return;
  const s = parseSource(d['信源']);
  const c = credOf(d);
  const sum = summaryOf(d);
  const link = d['链接'] || '';
  const st = decStatusOf(d);
  const bodyText = sum.kind === 'text'
    ? (plainText(sum.text) || '暂无摘要')
    : sum.kind === 'excerpt'
      ? plainText(sum.text)
      : sum.kind === 'meta'
        ? `该条目为论文元数据（${esc(sum.cat || 'arXiv')}${sum.id ? ' · arXiv:' + esc(sum.id) : ''}），摘要尚未生成。接入 LLM 后将自动补全中文要点。`
        : '摘要待生成。正文已存档，可随时重做。';
  const bodyLabel = sum.kind === 'excerpt' ? '原文摘录 · 未二次总结' : '要点摘要';

  $('#drawer').innerHTML = `
    <div class="drawer-head">
      <span class="k">EVIDENCE · 来源与证据</span>
      <div class="drawer-close" id="drawerClose" role="button" aria-label="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </div>
    </div>
    <div class="drawer-body">
      <div class="d-tags">
        ${lvlStamp(d['影响等级'] || 'C')}
        <span class="note-dom" style="--dom-color:${domColor(topicOf(d))}">${esc(topicOf(d))}</span>
        <span class="note-ev">${esc(eventOf(d))}</span>
        <span class="pill-cred ${c.cls}">${esc(c.c)} ${esc(c.score)}</span>
        ${s.cross ? `<span class="pill-cred" style="color:#4a7d69">多源 ×${s.cross}</span>` : ''}
      </div>
      <h2 class="d-title">${esc(zhTitle(d))}</h2>
      ${origTitle(d) ? `<div class="d-title-orig">（${esc(origTitle(d))}）</div>` : ''}
      <div class="d-sub">
        <span>${esc(fmtDate(d['发布时间']))}</span><span>/</span>
        <span>${esc(s.primary)}${s.extra ? ' +' + s.extra : ''}</span><span>/</span>
        <span>${esc(d['事件ID'] || '')}</span>
      </div>

      <div class="d-sec">
        <h5>${bodyLabel}</h5>
        <div class="d-text ${sum.kind === 'meta' ? 'muted' : ''}">${esc(bodyText)}</div>
      </div>

      ${d['研判结论'] ? `<div class="d-sec"><h5>研判结论</h5><div class="d-quote">${esc(d['研判结论'])}</div></div>` : ''}
      ${d['决策建议'] ? `<div class="d-sec"><h5>决策建议</h5><div class="d-quote">${esc(d['决策建议'])}</div></div>` : ''}
      ${(!d['研判结论'] && !d['决策建议']) ? `<div class="d-sec"><h5>研判与建议</h5>
        <div class="d-text muted">尚未生成。接入 LLM 后可输出研判结论与决策建议；要落到「试点 / 采购 / 立项」，还需接入企业战略参数。</div>
      </div>` : ''}

      <div class="d-sec">
        <h5>证据与来源</h5>
        <div class="ev">
          <div class="ev-row"><span>原始链接</span><b>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(hostOf(link))} ↗</a>` : '—'}</b></div>
          <div class="ev-row"><span>信源</span><b>${esc(s.parts.join(' + ') || '—')}</b></div>
          <div class="ev-row"><span>信源权重</span><b>${esc(c.score)}</b></div>
          <div class="ev-row"><span>独立出版方</span><b>${s.cross ? s.cross + ' 个（横向交叉）' : '1 个（单一来源）'}</b></div>
          <div class="ev-row"><span>纵向评级</span><b>${esc(verticalFor(s.primary))}</b></div>
          <div class="ev-row"><span>发布时间</span><b>${esc(d['发布时间'] || '—')}</b></div>
        </div>
      </div>

      <div class="d-sec">
        <h5>一致性校验</h5>
        <div class="verify">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg>
          <div>入库时已通过一致性校验：链接可访问 · 标题与正文一致
            <small>该口径仅用于排除「内容不在该 URL 上」的编造条目，原文仍以此链接为准。</small>
          </div>
        </div>
      </div>
    </div>
    <div class="drawer-foot">
      ${link ? `<a class="btn btn-primary" href="${esc(link)}" target="_blank" rel="noopener">打开原文</a>` : '<span class="btn" style="opacity:.45">无原文链接</span>'}
      <button class="btn ghost" id="dCopy">复制链接</button>
      <button class="btn ghost" id="dMark">${st === '跟进' ? '取消跟进' : '标记跟进'}</button>
    </div>`;

  document.body.classList.add('drawer-open');
  $('#mask').classList.add('show');
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');

  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#dCopy').addEventListener('click', () => {
    if (!link) return toast('无链接可复制');
    navigator.clipboard.writeText(link).then(() => toast('链接已复制')).catch(() => toast('复制失败'));
  });
  $('#dMark').addEventListener('click', () => {
    const id = d['事件ID'];
    if (!id) return;
    if (decState[id] === '跟进') delete decState[id];
    else decState[id] = '跟进';
    try { localStorage.setItem('dec_state', JSON.stringify(decState)); } catch (e) {}
    $('#dMark').textContent = decState[id] === '跟进' ? '取消跟进' : '标记跟进';
    if (tab === 'decision') renderDecision();
  });
}

function verticalFor(primary) {
  const hit = Object.values(statsData).find(s => s.name === primary);
  return hit ? `${hit.reliability ?? '—'} · ${hit.verdict || '数据不足'}` : '暂无纵向数据';
}
function closeDrawer() {
  $('#mask').classList.remove('show');
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('drawer-open');
}

load();
</script>
</body>
</html>
